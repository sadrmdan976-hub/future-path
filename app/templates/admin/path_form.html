{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}تعديل المسار | FUTURE PATH{% endblock %}

{% block content %}
<section class="page-head">
  <div class="wrap">
    <a class="back-link" href="/admin/paths">{{ icon("arrow") }} المسارات</a>
    <h1>تعديل المسار</h1>
  </div>
</section>

<section class="section section-tight">
  <div class="wrap form-narrow">
    {% if error %}<div class="notice notice-error">{{ icon("warning") }}<div>{{ error }}</div></div>{% endif %}
    <form method="post" action="/admin/paths/{{ path.id }}" class="form card">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field"><label>عنوان المسار <span class="req">*</span></label><input name="title" value="{{ path.title }}" maxlength="160" required></div>
      <div class="field">
        <label>الفئة</label>
        <select name="category">
          {% for key, label in categories.items() %}<option value="{{ key }}" {{ 'selected' if path.category == key }}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field"><label>الوصف <span class="req">*</span></label><textarea name="description" rows="4" maxlength="1200" required>{{ path.description }}</textarea></div>
      <div class="field"><label>رابط المورد <span class="req">*</span></label><input name="resource_url" value="{{ path.resource_url }}" dir="ltr" required></div>
      <div class="grid-2">
        <div class="field">
          <label>المستوى</label>
          <select name="level">
            {% for key, label in levels.items() %}<option value="{{ key }}" {{ 'selected' if path.level == key }}>{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div class="field"><label>المدة</label><input name="duration" value="{{ path.duration or '' }}" maxlength="60"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">حفظ التعديلات</button>
        <a class="btn btn-ghost" href="/admin/paths">إلغاء</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
